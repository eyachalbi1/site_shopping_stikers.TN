name: Update image manifest

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate images/manifest.json
        run: |
          cd images
          python3 - <<'PYEOF'
          import json, os
          exclude = {'readme.md', 'd17.png', 'manifest.json'}
          files = []
          for name in sorted(os.listdir('.')):
              if os.path.isfile(name) and name.lower() not in exclude:
                  ext = name.lower().rsplit('.',1)[-1] if '.' in name else ''
                  if ext in ('jpg','jpeg','png','webp','gif'):
                      files.append(name)
          with open('manifest.json','w',encoding='utf-8') as f:
              json.dump(files, f, ensure_ascii=False)
          print(f"{len(files)} images listed")
          PYEOF
          cd ..

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/manifest.json
          git diff --cached --quiet || git commit -m "Mise a jour automatique du manifeste d'images"
          git push
